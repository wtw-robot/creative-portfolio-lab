<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A flexible, friendly trip expense splitter."><title>FairShare</title><link rel="stylesheet" href="style.css"></head>
<body><header><a href="../../index.html">← 返回作品集</a><div class="brand"><i>F</i><span>FairShare</span></div><span class="saved">自动保存于本机</span></header>
<main><section class="hero"><p>Split without the awkward math</p><h1>一起出发，<br><em>轻松算清。</em></h1><p>输入总费用、人数和每个人的参与权重，马上得到公平又透明的分摊结果。</p></section>
<section class="calculator"><div class="form-panel"><div class="section-title"><span>01</span><div><h2>账单详情</h2><p>这次一共花了多少？</p></div></div><label class="amount-label">总金额<div class="amount-input"><span>¥</span><input id="amount" inputmode="decimal" value="1286.00" aria-label="Total amount"></div></label><div class="row"><label>小费比例<select id="tip"><option value="0">不含小费</option><option value="5">5%</option><option value="10" selected>10%</option><option value="15">15%</option><option value="20">20%</option></select></label><label>账单名称<input id="title" value="周末旅行" maxlength="28"></label></div>
<div class="section-title people-title"><span>02</span><div><h2>参与者</h2><p>权重 2 代表承担双份费用</p></div></div><div id="people"></div><button class="add" id="add">＋ 添加参与者</button></div>
<aside class="result-panel"><div class="receipt-head"><span>分摊结果</span><time id="date"></time></div><h3 id="receiptTitle">周末旅行</h3><div class="total"><small>含小费总额</small><strong id="grandTotal">¥1,414.60</strong></div><div class="rule"></div><div id="breakdown"></div><div class="summary"><div><span>账单</span><b id="base">¥1,286.00</b></div><div><span>小费</span><b id="tipAmount">¥128.60</b></div><div class="summary-total"><span>合计</span><b id="summaryTotal">¥1,414.60</b></div></div><button id="copy">复制分摊结果</button></aside></section></main>
<footer><span>FairShare · 一个简单的多人费用分摊器</span><span>数据不会离开你的浏览器</span></footer><script src="app.js"></script></body></html>
