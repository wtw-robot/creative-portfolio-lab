<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Generate palettes and check WCAG contrast."><title>Chroma Lab</title><link rel="stylesheet" href="style.css"></head>
<body><header><a href="../../index.html">← 返回作品集</a><strong>CHROMA / LAB</strong><button id="generateTop">生成新配色 <span>G</span></button></header>
<main><section class="title"><p>Color utility · 02</p><h1>让颜色<br><em>好看又好读。</em></h1><div><p>生成灵感配色，锁定喜欢的颜色，并实时检查文字是否符合 WCAG 无障碍对比度标准。</p><p class="hint">提示：按 <kbd>G</kbd> 快速生成</p></div></section>
<section class="palette" aria-label="Generated color palette" id="palette"></section>
<section class="contrast"><div class="contrast-copy"><p class="label">Contrast checker</p><h2>对比度检查</h2><p>选择前景色与背景色，确保内容对每个人都清晰可见。</p><div class="selectors"><label>文字颜色<input id="foreground" type="color" value="#153243"><input id="foregroundHex" value="#153243" maxlength="7"></label><button id="swap" aria-label="Swap colors">⇄</button><label>背景颜色<input id="background" type="color" value="#FFD166"><input id="backgroundHex" value="#FFD166" maxlength="7"></label></div></div><div class="preview" id="preview"><div class="ratio"><span id="ratio">9.28</span><small>CONTRAST RATIO</small></div><h3>Readable design<br>is better design.</h3><p>清晰的文字让信息抵达更多人。</p><div class="badges"><span id="normalBadge">AAA 正文</span><span id="largeBadge">AAA 大字</span></div></div></section></main>
<footer><span>Chroma Lab</span><span>WCAG 2.1 contrast standards</span></footer><script src="app.js"></script></body></html>
